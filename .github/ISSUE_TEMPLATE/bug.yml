name: Bug report
description: Something behaves differently from what the README says
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Store configuration
      description: The relevant entry from config/lsm.php, with secrets removed.
      render: php
    validations:
      required: true

  - type: textarea
    id: stats
    attributes:
      label: Output of `php artisan lsm:stats --json`
      render: json

  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: package 1.0.0, Laravel 13.2, PHP 8.4
    validations:
      required: true
